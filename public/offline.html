<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Neighbuur — Je bent offline</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #FAF7F2;
      color: #1A1A18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      text-align: center;
    }
    .card {
      max-width: 360px;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #578042;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .mark svg { width: 28px; height: 28px; }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 8px;
    }
    p {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #6B6860;
      margin: 0 0 24px;
    }
    button {
      font: inherit;
      font-weight: 600;
      font-size: 0.9375rem;
      color: #fff;
      background: #578042;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 256 256" fill="#FDFBF7"><path d="M224,120v96a8,8,0,0,1-8,8H160a8,8,0,0,1-8-8V164a4,4,0,0,0-4-4H108a4,4,0,0,0-4,4v52a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V120a16,16,0,0,1,4.69-11.31l80-80a16,16,0,0,1,22.62,0l80,80A16,16,0,0,1,224,120Z"/></svg>
    </div>
    <h1>Je bent offline</h1>
    <p>Zodra je weer verbinding hebt, laden we de laatste gegevens.</p>
    <button onclick="location.reload()">Opnieuw proberen</button>
  </div>
</body>
</html>
